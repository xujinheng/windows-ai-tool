name: Normalize v28 native UI Go formatting
on:
  push:
    paths:
      - '.github/workflows/v28-format.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Apply gofmt and push exact canonical source
        shell: bash
        run: |
          set -euo pipefail
          cd voice-rewrite
          gofmt -w settings_windows.go popup_windows.go handy_status_windows.go popup_layout.go popup_layout_test.go visual_skin_windows.go
          cd ..
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add voice-rewrite/
            git commit -m 'gofmt: canonicalize v28 native visual sources'
            git push origin HEAD:main
          fi
