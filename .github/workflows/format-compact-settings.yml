name: Format native settings PR
on:
  push:
    branches: ['design/direct2d-compact-settings']
    paths:
      - '.github/workflows/format-compact-settings.yml'
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Format changed settings code and commit only to feature branch
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w voice-rewrite/settings_windows.go voice-rewrite/settings_direct2d_windows.go
          if git diff --quiet -- voice-rewrite; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice-rewrite/settings_windows.go voice-rewrite/settings_direct2d_windows.go
          git commit -m "style(settings): gofmt native Direct2D form"
          git push origin HEAD:design/direct2d-compact-settings
