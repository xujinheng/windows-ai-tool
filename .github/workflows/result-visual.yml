name: VoiceRewrite result card screenshot
on:
  push:
    paths:
      - 'voice-rewrite/answer_visual_preview_windows.go'
      - 'voice-rewrite/popup_windows.go'
      - '.github/workflows/result-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Compile native GUI
        working-directory: voice-rewrite
        run: go build -trimpath -ldflags '-H=windowsgui' -o VoiceRewrite.exe .
      - name: Screenshot real result card
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path 'result-evidence' | Out-Null
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class ResultNative {
            [StructLayout(LayoutKind.Sequential)]
            public struct RECT { public int Left,Top,Right,Bottom; }
            [DllImport("user32.dll", CharSet=CharSet.Unicode)]
            public static extern IntPtr FindWindow(string cls,string title);
            [DllImport("user32.dll")]
            public static extern bool GetWindowRect(IntPtr hwnd,out RECT rect);
          }
          '@
          $env:VOICEREWRITE_VISUAL_PREVIEW='answer'
          $exe=Join-Path (Get-Location) 'voice-rewrite/VoiceRewrite.exe'
          $p=Start-Process -FilePath $exe -PassThru
          try {
            $hwnd=[IntPtr]::Zero
            for($i=0;$i -lt 30;$i++) {
              Start-Sleep -Milliseconds 500
              $hwnd=[ResultNative]::FindWindow('VoiceRewrite.ResultCard.v20','VoiceRewrite')
              if($hwnd -ne [IntPtr]::Zero) { break }
              $p.Refresh()
              if($p.HasExited) { throw "GUI exited: $($p.ExitCode)" }
            }
            if($hwnd -eq [IntPtr]::Zero) { throw 'Result card window not found' }
            $r=New-Object ResultNative+RECT
            if(-not [ResultNative]::GetWindowRect($hwnd,[ref]$r)) { throw 'GetWindowRect failed' }
            $w=$r.Right-$r.Left; $h=$r.Bottom-$r.Top
            if($w -lt 100 -or $h -lt 100) { throw "Invalid size: $w x $h" }
            $bmp=[System.Drawing.Bitmap]::new($w,$h)
            $g=[System.Drawing.Graphics]::FromImage($bmp)
            try {
              $g.CopyFromScreen($r.Left,$r.Top,0,0,[System.Drawing.Size]::new($w,$h))
              $bmp.Save((Join-Path (Get-Location) 'result-evidence/result-card-real.png'),[System.Drawing.Imaging.ImageFormat]::Png)
            } finally { $g.Dispose(); $bmp.Dispose() }
            [pscustomobject]@{width=$w;height=$h;interactive=[Environment]::UserInteractive} | ConvertTo-Json | Set-Content 'result-evidence/diagnostics.json'
          } finally { if(-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } }
      - name: Upload real screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoiceRewrite-result-card-real-PNG
          path: result-evidence/
          if-no-files-found: warn
