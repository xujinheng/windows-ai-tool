name: One-time v25 Go formatting
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v25-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Normalize Go source
        run: gofmt -w voice-rewrite/*.go
      - name: Verify source after formatting
        working-directory: voice-rewrite
        run: |
          go test ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/VoiceRewrite-check.exe .
      - name: Commit formatting, if needed
        shell: bash
        run: |
          set -euo pipefail
          git add voice-rewrite/*.go
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Normalize v25 Go formatting"
            git push origin HEAD:main
          fi
