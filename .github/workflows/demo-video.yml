name: Publish VoiceRewrite workflow demonstration video

on:
  push:
    branches: [main]
    paths:
      - 'docs/ui/*.png'
      - 'scripts/render-demo-video.py'
      - '.github/workflows/demo-video.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voicerewrite-demo-video-main
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install video renderer prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          # GitHub Ubuntu runners do not reliably include a Chinese font.
          # Without this package every caption becomes a tofu rectangle.
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          test -f /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
          ffmpeg -hide_banner -version | head -1
      - name: Render 30-second product video from real native UI screenshots
        shell: bash
        run: |
          set -euo pipefail
          python scripts/render-demo-video.py --assets docs/ui --output docs/demo
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 docs/demo/voicerewrite-demo.mp4
      - name: Verify deliverables
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import subprocess
          directory = Path('docs/demo')
          video=directory/'voicerewrite-demo.mp4'
          gif=directory/'voicerewrite-preview.gif'
          poster=directory/'poster.jpg'
          for path in [video,gif,poster]:
              if not path.is_file() or path.stat().st_size<4096:
                  raise SystemExit('Missing/empty demo asset: '+str(path))
          duration=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',str(video)],text=True))
          if not 29.9 <= duration <= 30.1:
              raise SystemExit(f'Unexpected demo length {duration}')
          with Image.open(gif) as image:
              if image.n_frames < 80:
                  raise SystemExit('Demo preview is not an animated GIF')
          print('MP4, animated GIF and thumbnail validated')
          PY
      - name: Upload rendered product demo
        uses: actions/upload-artifact@v4
        with:
          name: VoiceRewrite-product-demo-video
          path: |
            docs/demo/voicerewrite-demo.mp4
            docs/demo/voicerewrite-preview.gif
            docs/demo/poster.jpg
          if-no-files-found: error
      - name: Update README media on main (only for the current revision)
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git add -- docs/demo/voicerewrite-demo.mp4 docs/demo/voicerewrite-preview.gif docs/demo/poster.jpg
          if git diff --cached --quiet; then
            echo 'Video assets unchanged.'
            exit 0
          fi
          built_head="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$built_head" != "$remote_head" ]; then
            echo 'Main changed during rendering; skip old media. The newer UI commit will re-render.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(demo): update 30-second workflow video [skip ci]'
          git push origin HEAD:main
