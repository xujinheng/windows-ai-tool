name: Format compact result-card PR
on:
  push:
    branches: ['design/compact-click-away-result']
    paths:
      - '.github/workflows/format-compact-result.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Format only the changed native result files
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w voice-rewrite/popup_dismiss_windows.go voice-rewrite/popup_layout.go voice-rewrite/popup_layout_test.go voice-rewrite/popup_windows.go voice-rewrite/result_direct2d_windows.go
          if git diff --quiet -- voice-rewrite; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice-rewrite
          git commit -m "style(result): gofmt compact result implementation"
          git push origin HEAD:design/compact-click-away-result
