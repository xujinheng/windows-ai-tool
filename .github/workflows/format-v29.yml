name: Format v29 native UI sources
on:
  push:
    paths:
      - '.github/workflows/format-v29.yml'
      - 'voice-rewrite/settings_windows.go'
  workflow_dispatch:
# Avoid competing formatter commits when multiple UI edits land rapidly.
concurrency:
  group: native-ui-format-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Format and commit only if necessary
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w voice-rewrite/*.go
          if git diff --quiet -- voice-rewrite; then
            echo "All Go sources already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice-rewrite
          git commit -m "style: gofmt native Windows visual changes"
          # Never write a feature-branch format commit onto main.
          # A UI edit may land while the formatter is running: rebase the
          # mechanical formatting commit instead of pushing a stale head.
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
