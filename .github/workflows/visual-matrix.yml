name: Windows UI screenshots
on:
  push:
    paths:
      - 'voice-rewrite/appearance_windows.go'
      - 'voice-rewrite/visual_skin_windows.go'
      - 'voice-rewrite/settings_layout.go'
      - 'voice-rewrite/settings_direct2d_windows.go'
      - 'voice-rewrite/settings_field_geometry.go'
      - 'voice-rewrite/settings_field_geometry_test.go'
      - 'voice-rewrite/result_direct2d_windows.go'
      - 'voice-rewrite/popup_layout.go'
      - 'voice-rewrite/desktop_geometry.go'
      - 'voice-rewrite/desktop_monitor_windows.go'
      - 'scripts/publish-readme-screenshots.ps1'
      - 'voice-rewrite/settings_windows.go'
      - 'voice-rewrite/settings_direct2d_windows.go'
      - 'voice-rewrite/popup_windows.go'
      - 'voice-rewrite/handy_status_windows.go'
      - 'voice-rewrite/visual_preview_windows.go'
      - 'voice-rewrite/answer_visual_preview_windows.go'
      - '.github/workflows/visual-matrix.yml'
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: screenshot-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: voice-rewrite/go.mod
      # Build CI handles unit tests; screenshots validate the compiled real Win32 UI.
      - name: Build actual Go / Win32 EXE
        working-directory: voice-rewrite
        shell: pwsh
        run: |
          go build -trimpath -ldflags '-H=windowsgui' -o VoiceRewrite.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Capture Windows UI states
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force -Path 'visual-matrix' | Out-Null
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class MatrixWin {
            [StructLayout(LayoutKind.Sequential)]
            public struct RECT { public int Left,Top,Right,Bottom; }
            [DllImport("user32.dll",CharSet=CharSet.Unicode)]
            public static extern IntPtr FindWindow(string className,string title);
            [DllImport("user32.dll")]
            public static extern bool GetWindowRect(IntPtr hwnd,out RECT rect);
            [DllImport("user32.dll")]
            public static extern IntPtr SendMessage(IntPtr hwnd,uint msg,IntPtr wp,IntPtr lp);
            [DllImport("user32.dll")]
            public static extern IntPtr GetDlgItem(IntPtr hwnd,int id);
            [DllImport("user32.dll")]
            public static extern bool IsWindowVisible(IntPtr hwnd);
            [DllImport("user32.dll",CharSet=CharSet.Unicode)]
            public static extern IntPtr GetProp(IntPtr hwnd,string name);
            [DllImport("user32.dll",CharSet=CharSet.Unicode)]
            public static extern IntPtr FindWindowEx(IntPtr parent,IntPtr after,string cls,string title);
            [DllImport("user32.dll")]
            public static extern bool ClientToScreen(IntPtr hwnd,ref POINT p);
            [StructLayout(LayoutKind.Sequential)]
            public struct POINT { public int X,Y; }
            [DllImport("user32.dll")]
            public static extern bool SetCursorPos(int x,int y);
            [DllImport("user32.dll")]
            public static extern void mouse_event(uint flags,uint x,uint y,uint data,UIntPtr extra);
          }
          '@
          $exe=Join-Path (Get-Location) 'voice-rewrite/VoiceRewrite.exe'
          $cases=@(
            @{id='settings-light';kind='settings';theme='light';scale='1'},
            @{id='settings-focus-light';kind='settings';theme='light';scale='1';focus='1'},
            @{id='settings-dark';kind='settings';theme='dark';scale='1'},
            @{id='settings-ai-dark';kind='settings';theme='dark';scale='1';page=1},
            @{id='settings-input-dark';kind='settings';theme='dark';scale='1';page=2},
            @{id='settings-125';kind='settings';theme='light';scale='1.25'},
            @{id='settings-150';kind='settings';theme='dark';scale='1.5'},
            @{id='settings-200';kind='settings';theme='light';scale='2'},
            @{id='answer-light';kind='answer';theme='light';scale='1'},
            @{id='answer-dark-long';kind='answer';theme='dark';scale='1';long='1'},
            @{id='recording-200';kind='recording';theme='dark';scale='2'}
          )
          $report=@()
          foreach($case in $cases) {
            $env:VOICEREWRITE_VISUAL_PREVIEW=$case.kind
            $env:VOICEREWRITE_VISUAL_THEME=$case.theme
            $env:VOICEREWRITE_VISUAL_SCALE=$case.scale
            $env:VOICEREWRITE_VISUAL_LONG=$case.long
            $class=switch($case.kind) {
              'settings' {'VoiceRewrite.Settings'}
              'answer' {'VoiceRewrite.ResultCard'}
              'recording' {'VoiceRewrite.RecordingIndicator'}
            }
            $title=switch($case.kind) {
              'settings' {'VoiceRewrite · 连接设置'}
              'answer' {'VoiceRewrite'}
              'recording' {'VoiceRewrite status'}
            }
            $proc=Start-Process -FilePath $exe -PassThru
            try {
              $hwnd=[IntPtr]::Zero
              for($i=0;$i -lt 50;$i++) {
                Start-Sleep -Milliseconds 200
                $hwnd=[MatrixWin]::FindWindow($class,$title)
                if($hwnd -ne [IntPtr]::Zero){break}
                $proc.Refresh()
                if($proc.HasExited){throw "$($case.id): app exited: $($proc.ExitCode)"}
              }
              if($hwnd -eq [IntPtr]::Zero){throw "$($case.id): no HWND $class"}
              Start-Sleep -Milliseconds 450
              if($case.kind -eq 'settings') {
                # Verify this is the newly integrated native Direct2D renderer,
                # not the old Win32/GDI settings screen or isolated prototype.
                $d2dReady=[IntPtr]::Zero
                for($k=0;$k -lt 25;$k++){
                  $d2dReady=[MatrixWin]::GetProp($hwnd,'VoiceRewrite.Direct2D.FrameReady')
                  if($d2dReady -ne [IntPtr]::Zero){break}
                  Start-Sleep -Milliseconds 100
                }
                if($d2dReady -eq [IntPtr]::Zero){throw "$($case.id): Direct2D settings renderer did not paint"}
                $asr=[MatrixWin]::GetDlgItem($hwnd,9104)
                $llm=[MatrixWin]::GetDlgItem($hwnd,9105)
                $microphone=[MatrixWin]::GetDlgItem($hwnd,9107)
                $speechNav=[MatrixWin]::GetDlgItem($hwnd,9120)
                $aiNav=[MatrixWin]::GetDlgItem($hwnd,9121)
                $inputNav=[MatrixWin]::GetDlgItem($hwnd,9122)
                if($speechNav -eq [IntPtr]::Zero -or $aiNav -eq [IntPtr]::Zero -or $inputNav -eq [IntPtr]::Zero) {throw "Missing real sidebar navigation buttons"}
                if($asr -eq [IntPtr]::Zero -or $llm -eq [IntPtr]::Zero -or $microphone -eq [IntPtr]::Zero) {throw "Native ASR/AI/device inputs missing"}
                # Preserve the native state and confirm hiding old pages while
                # navigating. The user can move between service categories.
                $page=0
                if($case.ContainsKey('page')){$page=[int]$case.page}
                $pageButton=@($speechNav,$aiNav,$inputNav)[$page]
                [void][MatrixWin]::SendMessage($hwnd,0x0111,[IntPtr](9120+$page),$pageButton)
                Start-Sleep -Milliseconds 130
                $visible=@([MatrixWin]::IsWindowVisible($asr),[MatrixWin]::IsWindowVisible($llm),[MatrixWin]::IsWindowVisible($microphone))
                for($idx=0;$idx -lt 3;$idx++){
                  if($visible[$idx] -ne ($idx -eq $page)){throw "Sidebar selection $page has incorrect native page visibility: $($visible -join ',')"}
                }
              }
              if($case.kind -eq 'settings' -and $case.focus -eq '1') {
                $first=[MatrixWin]::FindWindowEx($hwnd,[IntPtr]::Zero,'Edit',$null)
                $second=[MatrixWin]::FindWindowEx($hwnd,$first,'Edit',$null)
                if($first -eq [IntPtr]::Zero -or $second -eq [IntPtr]::Zero){throw "missing native model ID editor"}
                $editRect=New-Object MatrixWin+RECT
                if(-not [MatrixWin]::GetWindowRect($second,[ref]$editRect)){throw "model edit rect unavailable"}
                [MatrixWin]::SetCursorPos($editRect.Left+25,[int](($editRect.Top+$editRect.Bottom)/2)) | Out-Null
                [MatrixWin]::mouse_event(2,0,0,0,[UIntPtr]::Zero)
                [MatrixWin]::mouse_event(4,0,0,0,[UIntPtr]::Zero)
                # CI's synthetic desktop sometimes refuses cross-process focus.
                # Explicitly deliver the same native EN_SETFOCUS event to verify paint.
                [void][MatrixWin]::SendMessage($hwnd,0x0111,[IntPtr]0x01000000,$second)
                Start-Sleep -Milliseconds 220
              }
              $rect=New-Object MatrixWin+RECT
              if(-not [MatrixWin]::GetWindowRect($hwnd,[ref]$rect)){throw "No window rect"}
              $w=$rect.Right-$rect.Left
              $h=$rect.Bottom-$rect.Top
              if($w -lt 110 -or $h -lt 30){throw "Invalid dimensions $w x $h"}
              $work=[System.Windows.Forms.SystemInformation]::VirtualScreen
              if($rect.Left -lt $work.Left -or $rect.Top -lt $work.Top -or $rect.Right -gt $work.Right -or $rect.Bottom -gt $work.Bottom) {
                throw "$($case.id): window clipped by virtual display $($work.ToString()); rect=$($rect.Left),$($rect.Top) $w x $h"
              }
              $suffixes=@('top')
              if($case.id -eq 'settings-200'){$suffixes=@('top','bottom')}
              foreach($suffix in $suffixes){
                if($suffix -eq 'bottom'){
                  [void][MatrixWin]::SendMessage($hwnd,0x115,[IntPtr]7,[IntPtr]::Zero)
                  [void][MatrixWin]::SendMessage($hwnd,0x114,[IntPtr]7,[IntPtr]::Zero)
                  Start-Sleep -Milliseconds 300
                  # An image alone is not a pass: the primary footer actions
                  # must remain fully visible even after BOTH axes scroll.
                  foreach($id in @(9101,9103,9102)) {
                    $ctrl=[MatrixWin]::GetDlgItem($hwnd,$id)
                    if($ctrl -eq [IntPtr]::Zero) {throw "Missing footer control $id"}
                    $cr=New-Object MatrixWin+RECT
                    if(-not [MatrixWin]::GetWindowRect($ctrl,[ref]$cr)) {throw "Footer control $id has no geometry"}
                    if($cr.Left -lt $rect.Left -or $cr.Right -gt $rect.Right -or $cr.Top -lt $rect.Top -or $cr.Bottom -gt $rect.Bottom) {
                      throw "$($case.id): footer control $id clipped after scroll: x=$($cr.Left)..$($cr.Right), y=$($cr.Top)..$($cr.Bottom)"
                    }
                  }
                }
                $bitmap=[System.Drawing.Bitmap]::new($w,$h)
                $g=[System.Drawing.Graphics]::FromImage($bitmap)
                try{
                  $g.CopyFromScreen($rect.Left,$rect.Top,0,0,[System.Drawing.Size]::new($w,$h))
                  if($case.focus -eq '1') {
                    # Assert a continuous purple focus border on actual screen
                    # pixels, including the left edge previously hidden by EDIT.
                    $origin=New-Object MatrixWin+POINT
                    if(-not [MatrixWin]::ClientToScreen($hwnd,[ref]$origin)){throw "client origin unavailable"}
                    $fx=$origin.X-$rect.Left+345
                    $fy=$origin.Y-$rect.Top+223
                    $samples=@(
                      @($fx,$fy+17),
                      @($fx+447,$fy+17),
                      @($fx+60,$fy),
                      @($fx+60,$fy+34)
                    )
                    $edges=@('left','right','top','bottom')
                    for($edge=0;$edge -lt 4;$edge++){
                      $match=$false
                      for($dx=-2;$dx -le 2 -and -not $match;$dx++){
                        for($dy=-2;$dy -le 2;$dy++){
                          $px=[int]($samples[$edge][0]+$dx)
                          $py=[int]($samples[$edge][1]+$dy)
                          if($px -lt 0 -or $py -lt 0 -or $px -ge $w -or $py -ge $h){continue}
                          $color=$bitmap.GetPixel($px,$py)
                          if($color.B -gt 155 -and $color.B-$color.G -gt 45 -and $color.B-$color.R -gt 35){$match=$true;break}
                        }
                      }
                      if(-not $match){throw "model focus border missing lilac $($edges[$edge]) edge"}
                    }
                    Write-Host 'CONFIRMED: all four sides of selected native model field have lilac focus outline'
                  }
                  $file=Join-Path (Get-Location) "visual-matrix/$($case.id)-$suffix.png"
                  $bitmap.Save($file,[System.Drawing.Imaging.ImageFormat]::Png)
                } finally {$g.Dispose();$bitmap.Dispose()}
              }
              $report+= [pscustomobject]@{case=$case.id;kind=$case.kind;theme=$case.theme;simulatedScale=$case.scale;width=$w;height=$h;windowVisible=[MatrixWin]::IsWindowVisible($hwnd);screen=$work.ToString()}
              Write-Host "CAPTURED $($case.id) $w x $h"
            } finally {
              $proc.Refresh()
              if(-not $proc.HasExited){Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue}
              Start-Sleep -Milliseconds 150
            }
          }
          $report | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 'visual-matrix/diagnostics.json'
      - name: Check UI captures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = 'visual-matrix'
          $expected = @('settings-light-top','settings-focus-light-top','settings-dark-top','settings-ai-dark-top','settings-input-dark-top','settings-125-top','settings-150-top','settings-200-top','settings-200-bottom','answer-light-top','answer-dark-long-top','recording-200-top')
          foreach ($name in $expected) {
            $path = Join-Path $folder ($name + '.png')
            if (!(Test-Path -LiteralPath $path)) { throw "Missing actual capture: $name" }
            if ((Get-Item $path).Length -lt 2000) { throw "Unusually small capture: $name" }
          }
          foreach ($pair in @(@('settings-light-top','settings-dark-top'),@('settings-200-top','settings-200-bottom'))) {
            $first = (Get-FileHash (Join-Path $folder ($pair[0] + '.png')) -Algorithm SHA256).Hash
            $second = (Get-FileHash (Join-Path $folder ($pair[1] + '.png')) -Algorithm SHA256).Hash
            if ($first -eq $second) { throw "Visual states rendered identically: $($pair -join ' vs ')" }
          }
          Write-Host 'Twelve Windows captures, including four-sided focus outline and native page visibility.'
      - name: Publish verified screenshots to README (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/publish-readme-screenshots.ps1 -CaptureDir 'visual-matrix' -OutputDir 'docs/ui'
          # The .ps1 script throws on errors; LASTEXITCODE may be stale from Go.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/ui
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'README screenshots have not changed.'
            exit 0
          }
          if ($LASTEXITCODE -ne 1) { throw "git diff --cached failed: $LASTEXITCODE" }
          $builtHead = (git rev-parse HEAD).Trim()
          $remoteLine = git ls-remote origin refs/heads/main
          if ($LASTEXITCODE -ne 0 -or !$remoteLine) { throw 'Cannot verify current main HEAD' }
          $remoteHead = ($remoteLine -split '\s+')[0]
          if ($remoteHead -ne $builtHead) {
            Write-Warning 'Main moved during capture. Do not publish screenshots from an older build; let the latest UI run publish them.'
            exit 0
          }
          git commit -m 'docs(ui): refresh real Windows interface screenshots [skip ci]'
          if ($LASTEXITCODE -ne 0) { throw "git commit failed: $LASTEXITCODE" }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "GitHub screenshot publication failed: $LASTEXITCODE" }
      - name: Upload README images
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: VoiceRewrite-readme-gallery
          path: docs/ui/
          if-no-files-found: warn
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoiceRewrite-ui-screenshots
          path: visual-matrix/
          if-no-files-found: warn
