name: Build VoiceRewrite Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Check Go formatting
        working-directory: voice-rewrite
        shell: pwsh
        run: |
          $unformatted = @(gofmt -l .)
          if ($unformatted.Count -gt 0) {
            Write-Error ("gofmt required: " + ($unformatted -join ", "))
            exit 1
          }
      - name: Test
        working-directory: voice-rewrite
        run: go test ./...
      - name: Vet
        working-directory: voice-rewrite
        # Win32 callbacks pass OS-owned memory addresses as uintptr.
        # Retain other go vet checks without suppressing warnings globally.
        run: go vet -unsafeptr=false ./...
      - name: Build x64 GUI
        working-directory: voice-rewrite
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        shell: pwsh
        run: go build -trimpath -ldflags '-H=windowsgui -s -w' -o VoiceRewrite.exe .
      - name: Package portable Windows build
        working-directory: voice-rewrite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'package/VoiceRewrite' -Force | Out-Null
          Copy-Item -LiteralPath 'VoiceRewrite.exe' -Destination 'package/VoiceRewrite/'
          Copy-Item -LiteralPath 'README.md' -Destination 'package/VoiceRewrite/'
          Copy-Item -LiteralPath 'config.example.json' -Destination 'package/VoiceRewrite/'
          Compress-Archive -Path 'package/VoiceRewrite' -DestinationPath 'VoiceRewrite-windows-x64.zip' -Force
          $hash = (Get-FileHash -LiteralPath 'VoiceRewrite-windows-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *VoiceRewrite-windows-x64.zip" | Set-Content -LiteralPath 'SHA256SUMS.txt' -Encoding ascii
      - name: Upload portable package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: VoiceRewrite-portable-windows-x64
          path: |
            voice-rewrite/VoiceRewrite-windows-x64.zip
            voice-rewrite/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: VoiceRewrite-windows-x64
          path: voice-rewrite/VoiceRewrite.exe
  build-oneclick:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Test OneClick
        working-directory: oneclick
        run: go test ./...
      - name: Vet OneClick
        working-directory: oneclick
        run: go vet ./...
      - name: Build Qwen3-ASR OneClick Windows x64 EXE
        working-directory: oneclick
        shell: pwsh
        run: go build -trimpath -ldflags '-s -w' -o Qwen3-ASR-OneClick-Windows-x64.exe .
      - name: Upload Qwen3-ASR OneClick executable
        uses: actions/upload-artifact@v4
        with:
          name: Qwen3-ASR-OneClick-Windows-x64
          path: oneclick/Qwen3-ASR-OneClick-Windows-x64.exe
          if-no-files-found: error
  publish-oneclick:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-oneclick
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Qwen3-ASR-OneClick-Windows-x64
          path: dist
      - name: Commit restored EXE to GitHub repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/Qwen3-ASR-OneClick-Windows-x64.exe
          if ! git diff --cached --quiet; then
            git commit -m "Publish restored Qwen3-ASR OneClick Windows x64 executable"
            git push origin HEAD:main
          fi
