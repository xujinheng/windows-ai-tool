name: Build VoiceRewrite Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Test
        working-directory: voice-rewrite
        run: go test ./...
      - name: Vet
        working-directory: voice-rewrite
        # Windows callbacks and GlobalLock return native pointers as uintptr.
        # These are intentional Win32 FFI conversions; keep every other vet check.
        run: go vet -unsafeptr=false ./...
      - name: Build x64 GUI
        working-directory: voice-rewrite
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        shell: pwsh
        run: go build -trimpath -ldflags '-H=windowsgui -s -w' -o VoiceRewrite.exe .
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: VoiceRewrite-windows-x64
          path: voice-rewrite/VoiceRewrite.exe
