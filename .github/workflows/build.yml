name: Build Windows tools
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        tool: [oneclick, voice-rewrite]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Test
        working-directory: ${{ matrix.tool }}
        run: go test ./...
      - name: Build x64
        working-directory: ${{ matrix.tool }}
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        shell: pwsh
        run: |
          $name = if ('${{ matrix.tool }}' -eq 'oneclick') { 'Qwen3-ASR-OneClick.exe' } else { 'VoiceRewrite.exe' }
          go build -trimpath -o $name .
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tool }}-windows-x64
          path: ${{ matrix.tool }}/*.exe
