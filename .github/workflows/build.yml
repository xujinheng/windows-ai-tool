name: Build VoiceRewrite Windows
on:
  push:
    branches: [main, feat/shortcut-key-capture]
    tags: [v*]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

# Cancel superseded branch/PR builds, but never cancel a tagged release.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Temporary formatting pass on this feature branch, removed before merge.
  shortcut-format:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/shortcut-key-capture'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: voice-rewrite/go.mod
      - name: Format shortcut changes
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w voice-rewrite/shortcut_options.go voice-rewrite/shortcut_options_test.go \
            voice-rewrite/windows.go voice-rewrite/task_worker_windows.go \
            voice-rewrite/settings_windows.go voice-rewrite/settings_direct2d_windows.go \
            voice-rewrite/mouse_windows.go
          git add -- voice-rewrite
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: gofmt native shortcut capture [skip ci]'
          git push origin HEAD:feat/shortcut-key-capture
  test-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: voice-rewrite/go.mod
      - name: Go format
        working-directory: voice-rewrite
        run: test -z "$(gofmt -l .)"
      - name: Test core with race detector
        working-directory: voice-rewrite
        run: go test -race -count=1 ./...
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: voice-rewrite/go.mod
      - name: Check Go formatting
        working-directory: voice-rewrite
        shell: pwsh
        run: |
          $unformatted = @(gofmt -l .)
          if ($unformatted.Count -gt 0) {
            Write-Error ("gofmt required: " + ($unformatted -join ", "))
            exit 1
          }
      - name: Test
        working-directory: voice-rewrite
        run: go test ./...
      - name: Vet
        working-directory: voice-rewrite
        # Win32 callbacks pass OS-owned pointers as uintptr; keep every other vet check.
        run: go vet -unsafeptr=false ./...
      - name: Build x64 GUI
        working-directory: voice-rewrite
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.29.0-dev' }
          go build -trimpath -ldflags "-H=windowsgui -s -w -X main.buildID=$version" -o VoiceRewrite.exe .
      - name: Package portable Windows build
        working-directory: voice-rewrite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'package/VoiceRewrite' -Force | Out-Null
          Copy-Item -LiteralPath 'VoiceRewrite.exe' -Destination 'package/VoiceRewrite/'
          Copy-Item -LiteralPath 'README.md' -Destination 'package/VoiceRewrite/'
          Copy-Item -LiteralPath 'config.example.json' -Destination 'package/VoiceRewrite/'
          Compress-Archive -Path 'package/VoiceRewrite' -DestinationPath 'VoiceRewrite-windows-x64.zip' -Force
          $hash = (Get-FileHash -LiteralPath 'VoiceRewrite-windows-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *VoiceRewrite-windows-x64.zip" | Set-Content -LiteralPath 'SHA256SUMS.txt' -Encoding ascii
      - name: Upload portable package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: VoiceRewrite-portable-windows-x64
          path: |
            voice-rewrite/VoiceRewrite-windows-x64.zip
            voice-rewrite/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: VoiceRewrite-windows-x64
          path: voice-rewrite/VoiceRewrite.exe
          if-no-files-found: error
      - name: Ensure Inno Setup compiler
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (Test-Path -LiteralPath $compiler) {
            Write-Host 'Inno Setup is already installed.'
          } else {
            choco install innosetup --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build per-user installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.29.0' }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler "/DAppVersion=$version" 'installer\VoiceRewrite.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          $packages = @(Get-ChildItem -LiteralPath 'installer/output' -Filter 'VoiceRewrite-Setup-*-x64.exe' -File)
          if ($packages.Count -ne 1) { throw 'Expected exactly one installer output' }
          $hash = (Get-FileHash -LiteralPath $packages[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$($packages[0].Name)" | Set-Content -LiteralPath 'installer/output/INSTALLER-SHA256SUMS.txt' -Encoding ascii
      # On version tags, GitHub signs provenance for the built artifacts via
      # short-lived OIDC credentials. This is NOT Authenticode publisher signing.
      - name: Attest portable archive provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4
        with:
          subject-path: voice-rewrite/VoiceRewrite-windows-x64.zip
      - name: Attest installer provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4
        with:
          subject-path: installer/output/VoiceRewrite-Setup-*-x64.exe
      - name: Upload installer and checksum
        uses: actions/upload-artifact@v4
        with:
          name: VoiceRewrite-installer-windows-x64
          path: installer/output/*
          if-no-files-found: error
  build-oneclick:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: oneclick/go.mod
      - name: Test OneClick
        working-directory: oneclick
        run: go test ./...
      - name: Vet OneClick
        working-directory: oneclick
        run: go vet ./...
      - name: Build Qwen3-ASR OneClick Windows x64 EXE
        working-directory: oneclick
        shell: pwsh
        run: go build -trimpath -ldflags '-s -w' -o Qwen3-ASR-OneClick-Windows-x64.exe .
      - name: Attest OneClick provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4
        with:
          subject-path: oneclick/Qwen3-ASR-OneClick-Windows-x64.exe
      - name: Upload Qwen3-ASR OneClick executable
        uses: actions/upload-artifact@v4
        with:
          name: Qwen3-ASR-OneClick-Windows-x64
          path: oneclick/Qwen3-ASR-OneClick-Windows-x64.exe
          if-no-files-found: error
  prerelease:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-core, build, build-oneclick]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: VoiceRewrite-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: Qwen3-ASR-OneClick-Windows-x64
          path: release
      - name: Publish unsigned preview release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true
